name: dz-tob-demo

# End-to-end demo stack:
#   parser    -- joins multicast, decodes DZ-TOB, writes JSONL on a Unix socket
#   bot       -- reads the Unix socket, writes ticks to ClickHouse
#   clickhouse -- stores quotes, trades, instruments
#   grafana   -- pre-provisioned dashboard over ClickHouse
#
# One command to run: `docker compose up -d` (after editing .env).
# SSH-tunnel host port 3000 to reach Grafana from your laptop.

services:
  parser:
    build:
      context: ..
      dockerfile: go/topofbook-parser/Dockerfile
    # Multicast joins + IGMP need the host's network stack. Host networking
    # is cleanest on Linux; containerized multicast via docker bridge needs
    # macvlan/ipvlan work we don't need here.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    volumes:
      - parser-socket:/var/run/dz
    command:
      - "--group=${DZ_MULTICAST_GROUP}"
      - "--marketdata-port=${DZ_MARKETDATA_PORT}"
      - "--refdata-port=${DZ_REFDATA_PORT}"
      - "--interface=${DZ_INTERFACE}"
      - "--output=unix:///var/run/dz/tob.sock"
      - "--metrics-addr=127.0.0.1:${PARSER_METRICS_PORT}"

  bot:
    build:
      context: ..
      dockerfile: go/topofbook-bot/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      parser:
        condition: service_started
    restart: unless-stopped
    volumes:
      - parser-socket:/var/run/dz:ro
    ports:
      - "127.0.0.1:${BOT_METRICS_PORT}:9091"
    command:
      - "--socket=/var/run/dz/tob.sock"
      - "--symbol=${DZ_SYMBOLS}"
      - "--metrics-addr=0.0.0.0:9091"
      - "--clickhouse-url=http://clickhouse:8123"
      - "--clickhouse-database=topofbook"

  depthofbook-parser:
    build: ../go/depthofbook-parser
    image: dz/depthofbook-parser:latest
    network_mode: host
    restart: unless-stopped
    command:
      - --group=${DZ_DOB_MULTICAST_GROUP}
      - --refdata-port=${DZ_DOB_REFDATA_PORT}
      - --mktdata-port=${DZ_DOB_MKTDATA_PORT}
      - --snapshot-port=${DZ_DOB_SNAPSHOT_PORT}
      - --interface=${DZ_INTERFACE}
      - --output=unix:///var/run/dz/dob.sock
      - --metrics-addr=127.0.0.1:9091
    volumes:
      - dz-sockets:/var/run/dz

  depthofbook-bot:
    build: ../go/depthofbook-bot
    image: dz/depthofbook-bot:latest
    restart: unless-stopped
    depends_on:
      - depthofbook-parser
      - clickhouse
    command:
      - --socket=/var/run/dz/dob.sock
      - --symbol=${DZ_DOB_SYMBOLS}
      - --depth=${DZ_DOB_DEPTH:-20}
      - --coalesce-ms=${DZ_DOB_COALESCE_MS:-50}
      - --metrics-addr=0.0.0.0:9092
      - --clickhouse-url=http://clickhouse:8123
      - --clickhouse-database=depthofbook
    ports:
      - "${DOB_BOT_METRICS_PORT:-9092}:9092"
    volumes:
      - dz-sockets:/var/run/dz

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    # Dev-mode settings: no auth, single-node, loose ulimits.
    # Not for production — see clickhouse-server.yml in the official docs
    # for hardening.
    environment:
      CLICKHOUSE_DB: topofbook
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT}:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT}:3000"

volumes:
  parser-socket:
  clickhouse-data:
  grafana-data:
  dz-sockets:
