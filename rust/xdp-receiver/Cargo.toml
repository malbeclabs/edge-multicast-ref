[package]
name = "edge-multicast-xdp-receiver"
version = "0.1.0"
edition = "2021"
authors = ["Malbec Labs <dev@malbeclabs.com>"]
license = "Apache-2.0"
repository = "https://github.com/malbeclabs/edge-multicast-ref"
description = "XDP-based receiver for DoubleZero edge multicast shred feeds"

[dependencies]
# Solana - upstream Agave
solana-ledger = "2.2"
solana-sdk = "2.2"

# eBPF / XDP
aya = "0.13"
aya-log = "0.2"

# AF_XDP
xsk-rs = "0.6"

# CLI + Config
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# System
libc = "0.2"

# Signal handling
ctrlc = { version = "3", features = ["termination"] }

# Misc
anyhow = "1"

# Shared types
xdp-filter-common = { path = "common", features = ["userspace"] }

[build-dependencies]
cargo_metadata = "0.19"
