[package]
name = "dz-ingress-poll"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A polled request/response Input for dz-ingress-core"

[dependencies]
dz-adapter-core = { path = "../../adapter/dz-adapter-core" }

# `poll` is the marker that makes `[ingress] kind = "poll"` resolve: it is on
# exactly when this crate is in the link, which is what lets the core answer
# "is that transport built into this binary?" without depending on the
# transports. `tokio` brings the production `Clock`, which this crate can
# afford because it already has the runtime.
dz-ingress-core = { path = "../dz-ingress-core", features = ["poll", "tokio"] }

# `poll_interval` is deserialized here, because a transport's own key is a
# transport's own to parse - the same rule that keeps `[ingress]` in one crate.
# `serde` and no `toml`, for the reason the core's manifest gives: the runtime
# owns the document.
serde = { workspace = true }

# For `ConfigError`, and for nothing else. Every *transport* failure this crate
# can have is one the core already names - a connect that did not, a connection
# that ended with a reason the reconnect metric counts by, or a fault retrying
# cannot fix - and a second error type for those would be one a driver would
# have to translate. A load-time refusal is not one of them: nothing has
# connected yet, and it is reported to whoever read the document.
thiserror = { workspace = true }

# The runtime. `time` for the request timeout. No `net`: the connector opens
# the socket. No `rt`: this crate spawns nothing and starts no runtime, so
# whichever one the binary runs is the one it uses.
tokio = { version = "1", default-features = false, features = ["time"] }

# The HTTP client. See the crate docs for why an async one exists here at all
# and what the second one in this workspace costs.
#
# **Pinned exactly, and as a set.** A client assembled out of three crates that
# share types - `hyper`'s `Request`, `hyper-util`'s connector, the body
# adapters - is one where any of the three moving under the other two is a type
# mismatch between two types with the same name. One exact version each is what
# makes that a deliberate change rather than a resolution.
#
# `default-features = false` and then only what is used, and the reason is the
# same as the websocket crate's: **no TLS backend may arrive by way of a
# default.** Deliberately excluded, and each of them is reachable by a default
# somewhere:
#
# - `native-tls`/OpenSSL, which `hyper-tls` would bring. A publisher's TLS
#   would then differ by host, because a distribution shipped a different
#   system library, and a venue building this crate would need one at all.
# - `aws-lc-rs`, which is `hyper-rustls`'s **default** crypto provider and
#   which builds C and assembly through cmake at build time.
# - `rustls-native-certs`, which `hyper-rustls`'s default `native-tokio`
#   feature brings, and which makes a host with an empty or stale CA bundle
#   fail to verify a certificate every other host verifies.
#
# So `hyper` carries no TLS at all, `hyper-rustls` is optional and behind this
# crate's own `tls` feature, and the trust anchors and the provider are named
# in code rather than discovered. A default that could pull one in would decide
# a venue's cryptography by dependency resolution.
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
] }
# Collecting a response body, and nothing else. A request carries no body.
http-body-util = "=0.1.5"

# TLS, behind this crate's `tls` feature, so that a build without it links no
# TLS stack and says so at configuration load rather than at the first request.
#
# `ring` rather than the default `aws-lc-rs` for the reason the websocket
# crate's manifest gives: the latter builds C and assembly through cmake, and a
# venue building this crate should not need a C toolchain to reach an endpoint
# over TLS. The `rustls` and `webpki-roots` versions are the ones the websocket
# crate already resolves, so there is one copy of rustls and one copy of the
# trust-anchor types in the graph - two would not typecheck together, and
# `hyper-rustls`'s own `webpki-tokio` feature is off precisely because it wants
# the other major version of `webpki-roots`.
hyper-rustls = { version = "=0.27.9", default-features = false, features = [
    "http1",
    "ring",
    "tls12",
    "logging",
], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
default = []

# An `https` endpoint. Off by default: a build that does not carry a TLS stack
# refuses `https` at configuration load, naming the scheme and this feature, so
# that an operator learns at load rather than at the first request.
tls = ["dep:hyper-rustls", "dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
# Dev-dependencies are not inherited by a venue, which is what makes these
# affordable.
#
# `toml` so that the `poll_interval` tests parse the same text an operator
# writes. `rt` and `macros` for the one test that constructs the production
# client, which is a builder call and not a request.
toml = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "time"] }
