[workspace]
resolver = "2"
members = [
    "codec/dz-edge-core",
    "codec/dz-edge-tob",
    "codec/dz-edge-mbp",
    "codec/dz-edge-refdata",
    "adapter/dz-adapter-core",
    "adapter/dz-adapter-uds",
    "publisher/dz-publisher-metrics",
    "publisher/dz-publisher-lowering",
    "publisher/dz-publisher-egress",
    "publisher/dz-publisher-refdata",
    "publisher/dz-publisher-runtime",
    "ingress/dz-ingress-core",
    "ingress/dz-ingress-websocket",
    "recorder/dz-recorder-core",
    "recorder/dz-recorder-archive",
    "recorder/dz-recorder-replay",
    "recorder/dz-recorder-capture",
    "recorder/dz-recorder-health",
    "recorder/dz-recorder-loss",
    "recorder/dz-recorder-relower",
    "recorder/dz-recorder-rows",
    "recorder/dz-recorder-clickhouse",
    "recorder/dz-recorder-load",
    "recorder/dz-recorder-e2e",
    "recorder/dz-recorder",
]
exclude = ["kernel-receiver", "xdp-receiver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
authors = ["Malbec Labs"]

[workspace.dependencies]
thiserror = "1.0"
# One 0.14.x is resolved for the whole graph, so this crate and a consumer
# that also depends on prometheus link the same copy and cannot disagree
# about the exposition format. The committed lockfile is what makes any two
# builds of the same commit resolve identically.
prometheus = "0.14.0"
tiny_http = "0.12"

# The recorder crates. Versions are pinned here so that the four of them
# cannot disagree about the archive format or the receive path.
#
# pcap-file is pinned exactly: 2.0.0 carries every pcapng element the design
# asks for, and 3.0.0-rc1 is the only newer release. A release candidate is
# not what the archive format sits on.
pcap-file = "=2.0.0"
zstd = "0.13"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# socket and net carry sockopt::{ReceiveTimestampns, RxqOvfl, Ipv4PacketInfo,
# Ipv4Ttl} and the matching ControlMessageOwned variants, which is all of
# socket mode with no unsafe and no C dependency.
nix = { version = "0.30", features = ["socket", "net", "time", "uio"] }
# AF_PACKET mode goes through libpcap rather than reaching past it to a raw
# socket. libpcap gives the mmap ring, BPF compilation and the drop counters,
# keeps every unsafe block inside the FFI crate, and is the seam that makes an
# accelerated capture framework a link-time change if the measured load ever
# justifies one. Optional, because it needs libpcap-dev at build time and the
# tests that do not touch it must still run where that is absent.
pcap = "2.5"
tempfile = "3"
