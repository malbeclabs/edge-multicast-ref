[workspace]
resolver = "2"
members = [
    "codec/dz-edge-core",
    "codec/dz-edge-tob",
    "codec/dz-edge-refdata",
    "publisher/dz-publisher-metrics",
]
exclude = ["kernel-receiver", "xdp-receiver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
authors = ["Malbec Labs"]

[workspace.dependencies]
thiserror = "1.0"
# Pinned: two libraries in one binary must not disagree about the exposition format.
prometheus = "0.14.0"
tiny_http = "0.12"
