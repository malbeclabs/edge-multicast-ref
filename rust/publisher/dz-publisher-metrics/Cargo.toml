[package]
name = "dz-publisher-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The normative set of Prometheus metrics a DoubleZero Edge publisher must emit"

[dependencies]
dz-edge-core = { path = "../../codec/dz-edge-core" }
# For the sizes of `Quote` and `Trade`, which `dz_publisher_egress_messages_per_datagram`'s
# buckets are derived from, so a codec that changes a message length moves them.
dz-edge-tob = { path = "../../codec/dz-edge-tob" }
prometheus = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }

[dev-dependencies]
# Only so the port-role table below can be held to the codec's own
# `AppMessage::PORT_ROLES`; the library reads nothing of the feeds but the
# top-of-book message sizes, which is why `dz-edge-tob` is a dependency above.
# The depth feed's message types are held to their port roles the same way,
# and that check is the only thing here that reads them.
dz-edge-mbp = { path = "../../codec/dz-edge-mbp" }
dz-edge-midpoint = { path = "../../codec/dz-edge-midpoint" }
dz-edge-refdata = { path = "../../codec/dz-edge-refdata" }
# The dependency goes this way round and must stay this way round: the adapter
# boundary mirrors two of the label taxonomies here, and it is this crate that
# holds the copies to the originals. `dz-adapter-core` depending on this one
# would put a Prometheus client in every venue repository.
dz-adapter-core = { path = "../../adapter/dz-adapter-core" }
