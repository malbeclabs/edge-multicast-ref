[package]
name = "dz-recorder-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The loader: walks a directory of completed objects and turns them into rows, idempotently"

[dependencies]
dz-recorder-rows = { path = "../dz-recorder-rows" }
# The market data derivation, reached only for the feeds a configuration names.
# Off by default, so a default build carries the codec and never runs it.
dz-recorder-events = { path = "../dz-recorder-events" }
dz-recorder-relower = { path = "../dz-recorder-relower" }
dz-recorder-core = { path = "../dz-recorder-core" }
# `derive_object` verifies the digest and hands back no source, so an enabled
# feed opens the object a second time and walks it with the codec.
dz-recorder-replay = { path = "../dz-recorder-replay" }
dz-recorder-clickhouse = { path = "../dz-recorder-clickhouse" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }
tiny_http = { workspace = true }
# The only way to stop a `--watch` without abandoning the pass it is in the
# middle of. std has no safe signal API and this crate forbids unsafe, so the
# handler is a dependency rather than a syscall — the same one and the same
# feature the recorder already uses.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
dz-edge-core = { path = "../../codec/dz-edge-core" }
# The real encoder, so that what the switch is asserted over is a stream a
# publisher could have sent rather than bytes a test agreed with itself about.
dz-edge-mbp = { path = "../../codec/dz-edge-mbp" }
dz-edge-refdata = { path = "../../codec/dz-edge-refdata" }
tempfile = { workspace = true }

[features]
# Passed through, so that `cargo test -p dz-recorder-load --features
# clickhouse-tests` reaches the suite that needs a server without the binary
# needing to know what the feature is for.
clickhouse-tests = ["dz-recorder-clickhouse/clickhouse-tests"]
tls = ["dz-recorder-clickhouse/tls"]
