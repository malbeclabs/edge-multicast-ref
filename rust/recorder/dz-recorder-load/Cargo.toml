[package]
name = "dz-recorder-load"
# The loader's own version, and deliberately not `version.workspace = true`.
#
# This number is what an operator pins a downloaded binary against, so it has to
# mean "the loader changed". Borrowed from the workspace it would move whenever
# the recorder — or a codec crate, or the publisher — was bumped, and a version
# that advances for a change to another binary is a version nobody can reason
# about: an operator comparing two pins cannot tell whether the loader they are
# running differs from the loader they were running.
#
# The alternative failure, two numbers a human keeps equal by hand, is not
# bought here either: nothing requires this to equal the workspace version, so
# there is no step to forget. What the two binaries must agree about is the
# archive format, and that is stated in the object — the Section Header block
# and the manifest beside it — where a loader can check it, rather than in a
# number on the outside of a tarball that nothing enforces.
#
# `.github/workflows/loader-release.yml` reads this key and refuses to publish a
# tag that disagrees with it.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The loader: walks a directory of completed objects and turns them into rows, idempotently"

[dependencies]
dz-recorder-rows = { path = "../dz-recorder-rows" }
dz-recorder-clickhouse = { path = "../dz-recorder-clickhouse" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }
tiny_http = { workspace = true }
# The only way to stop a `--watch` without abandoning the pass it is in the
# middle of. std has no safe signal API and this crate forbids unsafe, so the
# handler is a dependency rather than a syscall — the same one and the same
# feature the recorder already uses.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
dz-recorder-core = { path = "../dz-recorder-core" }
dz-recorder-replay = { path = "../dz-recorder-replay" }
dz-edge-core = { path = "../../codec/dz-edge-core" }
tempfile = { workspace = true }

[features]
# Passed through, so that `cargo test -p dz-recorder-load --features
# clickhouse-tests` reaches the suite that needs a server without the binary
# needing to know what the feature is for.
clickhouse-tests = ["dz-recorder-clickhouse/clickhouse-tests"]
tls = ["dz-recorder-clickhouse/tls"]
