[package]
name = "dz-recorder"
# The recorder's own version, and deliberately not `version.workspace = true`,
# for the reason the loader's manifest states at length: a binary's version is a
# pin, and the question a pin answers is *did this binary change*, which a number
# travelling with an unrelated release cannot answer.
#
# It was the workspace's until now, and that is what RELEASING.md exists to
# prevent: releasing `dz-recorder/v0.1.1` meant bumping `[workspace.package]`
# from 0.1.0 to 0.1.1, which moved the version of every library crate a consumer
# resolves for a change to a binary, and left the libraries claiming 0.1.1 with
# no `v0.1.1` tag to match. Starting at 0.1.1 rather than 0.1.0 keeps this equal
# to the release already published under that name.
#
# `.github/workflows/recorder-release.yml` reads this key and refuses to publish
# a tag that disagrees with it.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The recorder: captures an edge feed, archives the bytes, and says how it is doing"

[dependencies]
dz-recorder-core = { path = "../dz-recorder-core" }
dz-recorder-capture = { path = "../dz-recorder-capture" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
dz-recorder-health = { path = "../dz-recorder-health" }
dz-edge-core = { path = "../../codec/dz-edge-core" }
thiserror = { workspace = true }
tiny_http = { workspace = true }
# The only way to stop a recorder without losing the segment it holds. std has no
# safe signal API and this crate forbids unsafe, so the handler is a dependency
# rather than a syscall — the same one and the same feature the receivers in this
# repository already use.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# AF_PACKET capture, which needs libpcap-dev at build time. Off by default so the
# binary builds where that package is not installed; a configuration asking for
# it then fails at startup rather than silently recording through the fallback.
afpacket = ["dz-recorder-capture/afpacket"]
# The shutdown test at binary altitude. It needs IP_MULTICAST_LOOP delivery to
# this host, which is a property of the host rather than of the build, so it is
# off by default and CI enables it in the job that has already probed for it.
socket-e2e = []
