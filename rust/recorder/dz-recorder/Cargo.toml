[package]
name = "dz-recorder"
# The recorder's own version, and deliberately not `version.workspace = true`,
# for the reason the loader's manifest states at length: a binary's version is a
# pin, and the question a pin answers is *did this binary change*, which a number
# travelling with an unrelated release cannot answer.
#
# It was the workspace's until now, and that is what RELEASING.md exists to
# prevent: releasing `dz-recorder/v0.1.1` meant bumping `[workspace.package]`
# from 0.1.0 to 0.1.1, which moved the version of every library crate a consumer
# resolves for a change to a binary, and left the libraries claiming 0.1.1 with
# no `v0.1.1` tag to match. Starting at 0.1.1 rather than 0.1.0 keeps this equal
# to the release already published under that name.
#
# `.github/workflows/recorder-release.yml` reads this key and refuses to publish
# a tag that disagrees with it.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The recorder: captures an edge feed, archives the bytes, and says how it is doing"

[dependencies]
dz-recorder-core = { path = "../dz-recorder-core" }
dz-recorder-capture = { path = "../dz-recorder-capture" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
dz-recorder-health = { path = "../dz-recorder-health" }
dz-edge-core = { path = "../../codec/dz-edge-core" }
thiserror = { workspace = true }
tiny_http = { workspace = true }
# Inline mode, and every one of them optional: a `--no-default-features` build of
# the recorder has no column-store client, no HTTP client and no row crates in its
# tree. That build is the record-only one and is asked for by name — the feature
# is in the default set because the mode is the default mode. What keeps the
# destination out of the record path is not this list: it is that the capture path
# never blocks and never parses, and that derivation and posting are off it
# entirely. See the `inline` feature below.
dz-recorder-inline = { path = "../dz-recorder-inline", optional = true }
dz-recorder-rows = { path = "../dz-recorder-rows", optional = true }
dz-recorder-clickhouse = { path = "../dz-recorder-clickhouse", optional = true }
dz-recorder-load = { path = "../dz-recorder-load", optional = true }
# The second configuration file's parser. The recorder's own file is parsed by
# `dz-recorder-core`, so a default build needs neither of these.
serde = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
# The only way to stop a recorder without losing the segment it holds. std has no
# safe signal API and this crate forbids unsafe, so the handler is a dependency
# rather than a syscall — the same one and the same feature the receivers in this
# repository already use.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Inline mode is the default mode, so its feature is in the default set. A binary
# that refused the arrangement its own command line asks for when told nothing
# would be a binary whose default it cannot honour, and the mode it can run —
# archive mode — would be the one that takes a flag.
#
# `--no-default-features` is the record-only build. It carries no column-store
# client, no HTTP client and no row crates, can only ever be in archive mode, and
# refuses a command line naming no mode by this feature's name and by
# `--archive`. That build is what the feature is still for; what changed is which
# way round the default runs.
default = ["inline"]
# AF_PACKET capture, which needs libpcap-dev at build time. Off by default so the
# binary builds where that package is not installed; a configuration asking for
# it then fails at startup rather than silently recording through the fallback.
afpacket = ["dz-recorder-capture/afpacket"]
# Inline mode: one process captures a feed, derives its rows through the same
# derivation archive mode uses, and loads them — keeping no datagrams. In
# `default`, above, because the mode is what a command line naming no mode is
# read as.
#
# A command line naming no mode in a build without this feature fails at startup
# naming it, exactly as `capture.mode = "afpacket"` does for its own. Falling
# back to archive mode would leave a host keeping bytes where rows were asked
# for, which is the arrangement nobody chose.
inline = [
    "dep:dz-recorder-inline",
    "dep:dz-recorder-rows",
    "dep:dz-recorder-clickhouse",
    "dep:dz-recorder-load",
    "dep:serde",
    "dep:toml",
]
# TLS for the destination, passed through to the client that speaks to it. An
# `https` endpoint is refused rather than downgraded by a build without this, so
# a deployment that needs one turns it on beside `inline`. Weak, so that asking
# for it does not pull the column-store client into a build that has no inline
# mode.
tls = ["dz-recorder-clickhouse?/tls"]
# The shutdown test at binary altitude. It needs IP_MULTICAST_LOOP delivery to
# this host, which is a property of the host rather than of the build, so it is
# off by default and CI enables it in the job that has already probed for it.
socket-e2e = []
