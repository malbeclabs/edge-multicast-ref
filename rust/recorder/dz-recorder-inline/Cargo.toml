[package]
name = "dz-recorder-inline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Inline mode: one process captures a feed, derives its rows and loads them, keeping no datagrams"

# `dz-recorder-archive` is here for `SegmentManifest` and nothing else: a window
# has no object, but the derivation it feeds takes a manifest, so one is
# synthesised. No pcapng is written and none is read.
#
# `dz-recorder-replay` is deliberately absent. Inline mode reads no archive, and
# depending on it for `OwnedDatagram` — which is why that type moved to
# `dz-recorder-core` — would have pulled a pcapng parser and a decompressor into
# a build that opens neither.
[dependencies]
dz-edge-core = { path = "../../codec/dz-edge-core" }
dz-recorder-core = { path = "../dz-recorder-core" }
dz-recorder-capture = { path = "../dz-recorder-capture" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
dz-recorder-rows = { path = "../dz-recorder-rows" }
dz-recorder-load = { path = "../dz-recorder-load" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
prometheus = { workspace = true }

# The synthetic publisher, so every test here runs with no socket, no privilege
# and no server — including the one that holds a live derivation against an
# archived one.
[dev-dependencies]
dz-recorder-replay = { path = "../dz-recorder-replay" }
tempfile = { workspace = true }
