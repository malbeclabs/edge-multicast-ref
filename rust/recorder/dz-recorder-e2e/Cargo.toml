[package]
name = "dz-recorder-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "End-to-end tests where a publisher's encoder meets a recorder's capture, archive and replay"
publish = false

[dependencies]

[dev-dependencies]
dz-edge-core = { path = "../../codec/dz-edge-core" }
dz-edge-tob = { path = "../../codec/dz-edge-tob" }
dz-edge-mbp = { path = "../../codec/dz-edge-mbp" }
# No message type in `dz-edge-core` or `dz-edge-tob` lists the `refdata` port
# role, so without this the real encoder cannot produce a `refdata` datagram at
# all and the round trip would cover one port role out of three.
dz-edge-refdata = { path = "../../codec/dz-edge-refdata" }
dz-recorder-core = { path = "../dz-recorder-core" }
dz-recorder-archive = { path = "../dz-recorder-archive" }
dz-recorder-replay = { path = "../dz-recorder-replay" }
# The analysis tier's derivation, so that the rows a dashboard reads are held
# against datagrams the real encoder produced rather than against a fixture of
# what the derivation expects.
dz-recorder-rows = { path = "../dz-recorder-rows" }
# The market data derivation, held against the same archive the transport tier
# is held against: one encoder, one writer, two derivations, one set of bytes.
dz-recorder-events = { path = "../dz-recorder-events" }
# The column store, for the half of the market data suite that runs against a
# real server. Behind `clickhouse-tests`, so the default build needs no host.
dz-recorder-clickhouse = { path = "../dz-recorder-clickhouse" }
dz-recorder-capture = { path = "../dz-recorder-capture" }
tempfile = { workspace = true }
# `SegmentManifest` is `Deserialize`, so the per-instance coverage rows are
# asserted as the typed values the index table holds rather than found by a text
# search over the JSON.
serde_json = { workspace = true }

[features]
# The tests that open a real multicast socket and send over the loopback path.
#
# Off by default so that `cargo test` needs nothing of the host: a workstation
# or container with no multicast route must still be able to build and test this
# workspace. CI turns it on in a job of its own, behind a probe that proves the
# runner can deliver multicast to itself, so these tests do run on every pull
# request — being off by default is a statement about the default build and not
# about whether anything exercises them.
socket-e2e = []
# Validation against edge-feed-spec's own `dz-conformance`, which lives in that
# repository and is not vendored here. Off by default because the tool has to be
# built and pointed at through DZ_CONFORMANCE_BIN; on, the tests fail rather
# than skip when it is absent, because a conformance gate that passes when it
# could not run reports a clean feed for a stream nobody validated.
conformance = []
# The market data rows against a real column store: the checked-in DDL applied,
# the rows inserted through the real sink, and the counts read back. Off by
# default because it needs the container the demo provisions; on, the tests fail
# rather than skip when the server is absent, because a schema gate that passes
# when it could not run reports a clean schema for a schema nobody applied.
#
# `DZ_LOADER_CLICKHOUSE_URL` points at the server, as it does for
# dz-recorder-clickhouse's own suite.
clickhouse-tests = ["dz-recorder-clickhouse/clickhouse-tests"]
