[package]
name = "dz-adapter-uds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A normalized-event record encoding, and the built-in adapter that reads it"

[dependencies]
dz-adapter-core = { path = "../dz-adapter-core" }
thiserror = { workspace = true }

[dev-dependencies]
