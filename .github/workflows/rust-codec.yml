name: rust-codec

# Unfiltered, and deliberately. A paths-filtered workflow reports nothing on a
# pull request that touches none of its paths, and a *required* check that never
# reports blocks that pull request for ever — so a filter here is the thing that
# keeps these jobs out of the branch ruleset, which is the difference between a
# gate and a red X somebody may notice. go-tests.yml runs unfiltered for the
# same reason, and its checks are required.
#
# The cost is a Rust build on pull requests that change no Rust. That is minutes
# of a runner; the alternative is a test suite nothing enforces.
on:
  pull_request:
  push:
    branches: [main]

# The default token is broader than any job here needs, and every one of them
# executes each dependency's build.rs. Matches go-tests.yml.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Before the toolchain, because it needs none and a breach here is cheaper
      # to learn about in ten seconds than after a build.
      - name: Public-repository rules
        working-directory: .
        run: ./scripts/check-public-repo-rules.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Test (release)
        run: cargo test --all --release
      # Socket mode's own loopback test stays compile-only here: the job below
      # is the one that has established it can deliver multicast to itself.
      - name: Build (loopback tests)
        run: cargo test -p dz-recorder-capture --features loopback-tests --no-run
      # The polled transport's TLS build. Every step above enables no features,
      # so without these lines `HttpClient::tls_config`, both
      # `#[cfg(feature = "tls")]` connector definitions and two tests are never
      # compiled at all — while `rustls` and `webpki-roots` are caret
      # requirements, deliberately, so that there is one copy of each in the
      # graph with the websocket crate. A patch release that moves
      # `builder_with_provider` under us would therefore land green.
      #
      # In this job rather than a job of its own because the feature needs
      # nothing of the host, which is exactly what this job is for: what the
      # extra compile costs is the TLS stack and one crate, not a second pass
      # over the workspace. The `afpacket` job makes the same choice for
      # `dz-recorder --no-default-features` one feature over.
      - name: Clippy (dz-ingress-poll, tls)
        run: cargo clippy -p dz-ingress-poll --features tls --all-targets -- -D warnings
      - name: Test (dz-ingress-poll, tls)
        run: cargo test -p dz-ingress-poll --features tls

  # AF_PACKET mode is a separate job because it needs libpcap-dev at build
  # time, and the job above must stay the gate that needs no system package:
  # that independence is the whole reason socket mode was built first.
  afpacket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Clippy (afpacket)
        run: cargo clippy -p dz-recorder-capture --features afpacket --all-targets -- -D warnings
      - name: Test (afpacket)
        run: cargo test -p dz-recorder-capture --features afpacket
      # The binary's own afpacket branches. Without this line every
      # `#[cfg(feature = "afpacket")]` block in runner.rs and startup.rs is
      # neither type-checked nor run — in the *default* capture mode, which is
      # how a quiet feed that could not be shut down stayed invisible.
      - name: Clippy (dz-recorder, afpacket)
        run: cargo clippy -p dz-recorder --features afpacket --all-targets -- -D warnings
      - name: Test (dz-recorder, afpacket)
        run: cargo test -p dz-recorder --features afpacket
      # The record-only build, and the same argument one feature over. Inline
      # mode is the default mode, so its feature is in the default set and every
      # other job here compiles it; this is the only job that compiles the
      # binary without it. What lives behind `#[cfg(not(feature = "inline"))]`
      # is the refusal a build which cannot derive a row makes when a command
      # line names no mode — the arrangement that reading asks for — and a
      # refusal only exercised in the builds that never make it is no refusal at
      # all.
      - name: Clippy (dz-recorder, no default features)
        run: cargo clippy -p dz-recorder --no-default-features --all-targets -- -D warnings
      - name: Test (dz-recorder, no default features)
        run: cargo test -p dz-recorder --no-default-features
      # The live capture needs CAP_NET_RAW and a real device, so
      # afpacket-live-tests is compiled here and run by hand: a test that can
      # only run by hand must not be able to fail the build.
      - name: Build (afpacket live tests)
        run: cargo test -p dz-recorder-capture --features afpacket-live-tests --no-run

  # The end-to-end suite where a publisher's encoder meets a recorder's capture,
  # archive and replay over a real socket. It runs on every pull request because
  # it is the only test that proves the two halves agree about the wire rather
  # than about each other's fixtures.
  #
  # Running is not blocking. Whether a red run can stop a merge is decided by
  # the branch ruleset's required checks, which this file cannot set: dropping
  # the paths filter above is what makes these jobs eligible to be listed there,
  # and listing them is an administrator's action.
  #
  # The probe runs first and deliberately does not skip: a runner that cannot
  # deliver multicast to itself fails here in one line, rather than failing
  # inside a capture with an errno to interpret — or worse, passing while
  # gating nothing.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Can this runner deliver multicast to itself?
        run: ./scripts/probe-loopback-multicast.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - name: Clippy (socket-e2e)
        working-directory: rust
        run: cargo clippy -p dz-recorder-e2e --features socket-e2e --all-targets -- -D warnings
      - name: Test (encoder to archive, no socket)
        working-directory: rust
        run: cargo test -p dz-recorder-e2e
      - name: Test (over a real socket)
        working-directory: rust
        run: cargo test -p dz-recorder-e2e --features socket-e2e -- --test-threads=1
      - name: Test (loopback capture)
        working-directory: rust
        run: cargo test -p dz-recorder-capture --features loopback-tests
      # The shutdown sequence at binary altitude: a real process, a real
      # SIGTERM, and an object on the disk afterwards. It belongs in this job
      # because it needs the same multicast-capable runner the probe proved.
      - name: Test (shutdown, real process)
        working-directory: rust
        run: cargo test -p dz-recorder --features socket-e2e

  # The analysis tier's column-store suite: the checked-in DDL applied to a real
  # server, then a load, a re-load, the arithmetic and the TTL.
  #
  # A separate job because it needs a server, and the job above must stay the
  # gate that needs nothing of the host — the same split `afpacket` already
  # makes, for the same reason. The image is the one the demo provisions, pinned
  # to the same tag: a schema proved against a different major version is a
  # schema nobody proved.
  #
  # The suite fails rather than skips when the server is absent, so this is a
  # gate and not a hope. Everything it does happens in a scratch database it
  # creates and drops.
  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
        env:
          # Dev-mode: no auth, single node. The suite reaches it over the
          # runner's own loopback and nothing else can.
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      # Before the tests, because a health check that passed while the server
      # was still loading its own databases produces a first failure nobody can
      # interpret.
      - name: Is the server answering?
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/ping; then exit 0; fi
            sleep 2
          done
          echo "the column store never answered on 8123" >&2
          exit 1
      - name: Clippy (clickhouse-tests)
        working-directory: rust
        run: cargo clippy -p dz-recorder-clickhouse --features clickhouse-tests --all-targets -- -D warnings
      # The market data half of the end-to-end suite, which is the only place
      # the derivation's rows meet the checked-in DDL. A column whose type
      # cannot hold what the deriver puts in it is refused by the server and by
      # nobody else, so without this line that failure has no gate at all.
      - name: Clippy (dz-recorder-e2e, clickhouse-tests)
        working-directory: rust
        run: cargo clippy -p dz-recorder-e2e --features clickhouse-tests --all-targets -- -D warnings
      - name: Test (the DDL against a real server)
        working-directory: rust
        env:
          DZ_LOADER_CLICKHOUSE_URL: http://127.0.0.1:8123
        # Serially: each test creates and drops a database of its own, and
        # `OPTIMIZE ... FINAL` is a server-wide operation worth not overlapping.
        run: cargo test -p dz-recorder-clickhouse --features clickhouse-tests -- --test-threads=1
      - name: Test (market data rows against a real server)
        working-directory: rust
        env:
          DZ_LOADER_CLICKHOUSE_URL: http://127.0.0.1:8123
        # Serially, for the reason above: each test creates and drops a
        # database of its own.
        run: cargo test -p dz-recorder-e2e --features clickhouse-tests -- --test-threads=1

  # The specification's own rule set, over what this repository's publisher
  # writes and its recorder keeps. Everything else here compares the chain
  # against itself, which cannot catch both halves agreeing on something the
  # spec forbids — and that class of bug has shipped before, which is why the
  # tool exists.
  #
  # The tool lives in edge-feed-spec, a separate public repository, and is
  # pinned: an unpinned download means the rule set changes under this
  # repository without a commit here, so a rule-set update should be a
  # deliberate bump rather than a build that broke overnight.
  conformance:
    runs-on: ubuntu-latest
    env:
      # The released binary and not a build of the source: a release stamps the
      # commit it was built from, and the runner refuses a tool that answers
      # `dev+none`. What passes here is therefore the same binary a loader host
      # would be given, answering the same version.
      #
      # The floors so far: pcapng input with `epb_dropcount` (upstream #63), the
      # `STRIKE.*` rules (upstream #93), and now `-rule-report` (upstream #121),
      # the placed per-rule report the runner reads and the reason
      # `depth_feed.rs` can assert rows rather than an exit code.
      #
      # Pinned at conformance/v0.5.0, commit 546ed5c (upstream #121). The move
      # from 57f2bd3 carries fifteen commits. Six change what the rule set
      # judges or reports — #112 and #116 (the mbo book's id sets bounded),
      # #113 (a snapshot group loss merged with the next one is unverifiable),
      # #115 (any reset count change is a reset, per channel), #119 (refdata
      # state keyed on the channel instance) and #121 (the rule report) — and
      # the rest are specification text and CI.
      SPEC_TAG: conformance/v0.5.0
      SPEC_VERSION: v0.5.0+546ed5c2a7d3
      SPEC_ASSET: dz-conformance_0.5.0_linux_amd64
      # The archive's digest, pinned here as well as checked against the
      # release's own `.sha256`: that file only proves the two assets agree,
      # and a release can be replaced under its tag.
      SPEC_SHA256: 0c9881bceb74e17b6c16800cea9ab7326ffd0f376165ddde7f82f9fc69f9d28d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download dz-conformance
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/malbeclabs/edge-feed-spec/releases/download/${SPEC_TAG}"
          curl -fsSL --retry 3 -o "${SPEC_ASSET}.tar.gz" "${base}/${SPEC_ASSET}.tar.gz"
          curl -fsSL --retry 3 -o "${SPEC_ASSET}.tar.gz.sha256" "${base}/${SPEC_ASSET}.tar.gz.sha256"
          sha256sum --check --strict "${SPEC_ASSET}.tar.gz.sha256"
          echo "${SPEC_SHA256}  ${SPEC_ASSET}.tar.gz" | sha256sum --check --strict
          tar -xzf "${SPEC_ASSET}.tar.gz"
          mv "${SPEC_ASSET}/dz-conformance" "$RUNNER_TEMP/dz-conformance"
          version="$("$RUNNER_TEMP/dz-conformance" --version)"
          echo "dz-conformance --version: ${version}"
          if [ "${version}" != "${SPEC_VERSION}" ]; then
            echo "::error::expected ${SPEC_VERSION}, the tool answers ${version}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - name: Clippy (conformance)
        working-directory: rust
        run: cargo clippy -p dz-recorder-e2e --features conformance --all-targets -- -D warnings
      # The suite fails rather than skips when the tool is absent, so this line
      # is a gate and not a hope.
      - name: Test (against the specification's rule set)
        working-directory: rust
        env:
          DZ_CONFORMANCE_BIN: ${{ runner.temp }}/dz-conformance
        run: cargo test -p dz-recorder-e2e --features conformance
