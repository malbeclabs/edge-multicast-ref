name: go tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/marketbyorder-bot
          - go/marketbyorder-parser
          - go/marketbyprice-parser
          - go/internal
          - go/kernel-receiver
          - go/topofbook-bot
          - go/topofbook-parser
          - gre-decap

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum

      - name: test
        working-directory: ${{ matrix.module }}
        env:
          TMPDIR: /tmp
        run: go test ./...
