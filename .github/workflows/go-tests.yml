name: go tests

# Unfiltered, and deliberately, for the reason rust-codec.yml states at length:
# a paths-filtered workflow reports nothing on a pull request that touches none
# of its paths, and a *required* check that never reports blocks that pull
# request for ever. These checks are required.
#
# Adding `testdata/golden/**` to a filter would not make one safe. It would be
# necessary — these suites assert against those vectors, so a commit touching
# only a vector has to run them — and it would not be sufficient.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - go/marketbyorder-bot
          - go/marketbyorder-parser
          - go/marketbyprice-parser
          - go/marketbyprice-bot
          - go/internal
          - go/kernel-receiver
          - go/topofbook-bot
          - go/topofbook-parser
          - gre-decap

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum

      # -race is what makes the socket sink's concurrency guards testable: the
      # sink holds its mutex across every send so Close cannot close a client's
      # outbound queue mid-send, and reverting that survives repeated plain runs
      # while the race detector fails on the first.
      - name: test
        working-directory: ${{ matrix.module }}
        env:
          TMPDIR: /tmp
        run: go test -race ./...
